name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Builds slide data from deck/ and runs the parity check (fails on any mismatch)
      - run: npm run deck
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Every slide renders, presenter mode and audience window stay in sync, quizzes work
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
